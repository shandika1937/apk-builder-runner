name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.5.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3.2.1
      - name: Build with Gradle
        run: ./gradlew assembleDebug