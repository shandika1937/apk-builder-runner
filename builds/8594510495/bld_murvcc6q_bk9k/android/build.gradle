buildscript {    repositories {        google()        mavenCentral()    }    dependencies {        classpath 'com.android.tools.build:gradle:8.2.0'    }}allprojects {    repositories {        google()        mavenCentral()    }}rootProject.buildDir = '../build'subprojects {    project.buildDir = "${rootProject.buildDir}/${project.name}"    project.evaluationDependsOn(':app')    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {        kotlinOptions {            jvmTarget = '17'        }    }}tasks.register('clean', Delete) {    delete rootProject.buildDir}