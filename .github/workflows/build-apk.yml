name: Fast APK Builder CI

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Build Job ID"
        required: true
        type: string
      user_id:
        description: "Telegram User ID"
        required: true
        type: string
      branch_name:
        description: "Target Job Branch"
        required: false
        type: string
        default: "main"
      project_path:
        description: "Path to Project Root directory"
        required: false
        type: string
        default: "."
      project_type:
        description: "Project type (android | flutter | apk_base | auto)"
        required: false
        type: string
        default: "auto"
      variant:
        description: "Build Variant (debug | release)"
        required: false
        type: string
        default: "debug"
      enable_profile:
        description: "Enable Gradle --profile logging"
        required: false
        type: string
        default: "false"
      enable_scan:
        description: "Enable Gradle --scan build scan"
        required: false
        type: string
        default: "false"

jobs:
  build:
    name: Build APK (${{ inputs.job_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_name != '' && inputs.branch_name || github.ref }}
          fetch-depth: 1

      - name: 🔍 Detect Project Structure
        id: detect
        run: |
          PROJ_DIR="${{ inputs.project_path }}"
          if [ ! -d "$PROJ_DIR" ] || [ "$PROJ_DIR" = "." ]; then
            if [ -d "builds/${{ inputs.user_id }}/${{ inputs.job_id }}" ]; then
              PROJ_DIR="builds/${{ inputs.user_id }}/${{ inputs.job_id }}"
            fi
          fi

          if [ -f "$PROJ_DIR/project.zip" ]; then
            echo "Extracting $PROJ_DIR/project.zip..."
            unzip -o -q "$PROJ_DIR/project.zip" -d "$PROJ_DIR"
          elif [ -f "project.zip" ]; then
            echo "Extracting root project.zip..."
            unzip -o -q "project.zip" -d "$PROJ_DIR"
          fi

          find "$PROJ_DIR" -maxdepth 2 -name "*.zip" -not -name "project.zip" -exec unzip -o -q {} -d "$PROJ_DIR" \; 2>/dev/null || true

          PUBSPEC_FOUND=$(find "$PROJ_DIR" -maxdepth 5 -name "pubspec.yaml" -not -path "*/.gradle/*" -not -path "*/.dart_tool/*" | head -n 1)
          MAIN_DART_FOUND=$(find "$PROJ_DIR" -maxdepth 5 -name "main.dart" -not -path "*/.gradle/*" -not -path "*/.dart_tool/*" | head -n 1)
          ANY_DART_FOUND=$(find "$PROJ_DIR" -maxdepth 5 -name "*.dart" -not -path "*/.gradle/*" -not -path "*/.dart_tool/*" | head -n 1)
          GRADLE_FOUND=$(find "$PROJ_DIR" -maxdepth 5 \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" \) -not -path "*/.gradle/*" | head -n 1)
          APK_FOUND=$(find "$PROJ_DIR" -maxdepth 5 -name "*.apk" -not -path "*/dist-apk/*" -not -path "*/build/*" | head -n 1)

          if [ -n "$PUBSPEC_FOUND" ] && ( [ -n "$MAIN_DART_FOUND" ] || [ -n "$ANY_DART_FOUND" ] ); then
            echo "type=flutter" >> $GITHUB_OUTPUT
            PROJ_DIR=$(dirname "$PUBSPEC_FOUND")
            echo "Framework: Flutter Project at $PROJ_DIR"
          elif [ -n "$GRADLE_FOUND" ]; then
            echo "type=android" >> $GITHUB_OUTPUT
            PROJ_DIR=$(dirname "$GRADLE_FOUND")
            echo "Framework: Android Gradle Project at $PROJ_DIR"
          elif [ -n "$APK_FOUND" ]; then
            echo "type=apk_base" >> $GITHUB_OUTPUT
            PROJ_DIR=$(dirname "$APK_FOUND")
            echo "Framework: Base APK at $PROJ_DIR"
          else
            echo "type=android" >> $GITHUB_OUTPUT
            echo "Framework: Default Android Gradle at $PROJ_DIR"
          fi
          echo "proj_dir=$PROJ_DIR" >> $GITHUB_OUTPUT

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        if: steps.detect.outputs.type == 'android'

      - name: 📱 Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 🐦 Setup Flutter SDK
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: false

      - name: 🔎 Diagnose Flutter Project
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ steps.detect.outputs.proj_dir }}
        run: |
          echo "========================================="
          echo "🔎 DIAGNOSE FLUTTER PROJECT"
          echo "========================================="

          # Versions
          echo -n "Flutter: " && (flutter --version 2>&1 | head -n 1) || echo "Unknown"
          echo -n "Dart: " && (dart --version 2>&1) || echo "Unknown"
          echo -n "Java: " && (java -version 2>&1 | head -n 1) || echo "Unknown"

          GRADLE_WRAPPER_FILE=$(find . -name "gradle-wrapper.properties" | head -n 1)
          if [ -n "$GRADLE_WRAPPER_FILE" ]; then
            GRADLE_VER=$(grep "distributionUrl" "$GRADLE_WRAPPER_FILE" | sed 's/.*gradle-\([0-9.]*\)-.*/\1/' || echo "Unknown")
            echo "Gradle: $GRADLE_VER (from $GRADLE_WRAPPER_FILE)"
          else
            echo "Gradle: Not specified (wrapper missing)"
          fi

          # AGP version from settings or build.gradle
          AGP_VER=$(grep -rn "com.android.application" . 2>/dev/null | grep "version" | head -n 1 | sed 's/.*version\s*["'\'']\([^"'\'']*\).*/\1/' || echo "Unknown")
          echo "AGP: ${AGP_VER:-Unknown}"

          # compileSdk, targetSdk, minSdk
          COMPILE_SDK=$(grep -rn "compileSdk" android/ 2>/dev/null | head -n 1 | sed 's/[^0-9]*//g' || echo "Unknown")
          TARGET_SDK=$(grep -rn "targetSdk" android/ 2>/dev/null | head -n 1 | sed 's/[^0-9]*//g' || echo "Unknown")
          MIN_SDK=$(grep -rn "minSdk" android/ 2>/dev/null | head -n 1 | sed 's/[^0-9]*//g' || echo "Unknown")
          echo "compileSdk: ${COMPILE_SDK:-34}"
          echo "targetSdk: ${TARGET_SDK:-34}"
          echo "minSdk: ${MIN_SDK:-21}"

          echo "Project type: Flutter"

          # Check pub dependencies
          echo -n "Pub dependencies: "
          if flutter pub get -v > pub_diag.log 2>&1; then
            echo "OK"
          else
            echo "FAILED"
            cat pub_diag.log | tail -n 25
          fi

          # Android configuration
          echo -n "Android configuration: "
          if [ -d "android" ] && ( [ -f "android/build.gradle" ] || [ -f "android/build.gradle.kts" ] ); then
            echo "OK"
          else
            echo "FAILED"
          fi
          echo "========================================="

      - name: 🔨 Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ steps.detect.outputs.proj_dir }}
        run: |
          echo "=== Building Flutter APK ==="
          git config --global --add safe.directory "*" || true

          echo "=== Applying AGP & Flutter Compatibility Fixes ==="
          # Fix 1: Upgrade Gradle wrapper to 8.14 if project has older Gradle < 8.14
          find . -name "gradle-wrapper.properties" | while read -r pFile; do
            echo "Upgrading wrapper in $pFile to gradle-8.14-all.zip..."
            sed -i 's/gradle-[0-9.]*-\(all\|bin\)\.zip/gradle-8.14-all.zip/g' "$pFile"
          done

          # Fix 2: AGP compatibility flags
          mkdir -p ~/.gradle
          touch ~/.gradle/gradle.properties
          grep -q "android.newDsl" ~/.gradle/gradle.properties && sed -i 's/android.newDsl=true/android.newDsl=false/g' ~/.gradle/gradle.properties || echo "android.newDsl=false" >> ~/.gradle/gradle.properties
          grep -q "android.builtInKotlin" ~/.gradle/gradle.properties && sed -i 's/android.builtInKotlin=true/android.builtInKotlin=false/g' ~/.gradle/gradle.properties || echo "android.builtInKotlin=false" >> ~/.gradle/gradle.properties
          grep -q "org.gradle.jvmargs" ~/.gradle/gradle.properties || echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties

          find . -name "gradle.properties" | while read -r pFile; do
            echo "Patching $pFile for android.newDsl compatibility"
            grep -q "android.newDsl" "$pFile" && sed -i 's/android.newDsl=true/android.newDsl=false/g' "$pFile" || echo "android.newDsl=false" >> "$pFile"
            grep -q "android.builtInKotlin" "$pFile" && sed -i 's/android.builtInKotlin=true/android.builtInKotlin=false/g' "$pFile" || echo "android.builtInKotlin=false" >> "$pFile"
          done

          if [ -d "android" ]; then
            touch android/gradle.properties
            grep -q "android.newDsl" android/gradle.properties && sed -i 's/android.newDsl=true/android.newDsl=false/g' android/gradle.properties || echo "android.newDsl=false" >> android/gradle.properties
            grep -q "android.builtInKotlin" android/gradle.properties && sed -i 's/android.builtInKotlin=true/android.builtInKotlin=false/g' android/gradle.properties || echo "android.builtInKotlin=false" >> android/gradle.properties
          fi

          echo "Running flutter doctor..."
          flutter doctor -v

          echo "Running flutter pub get..."
          flutter pub get -v

          echo "Applying Flutter final class IconData compatibility fix..."
          if [ -n "$FLUTTER_ROOT" ] && [ -f "$FLUTTER_ROOT/packages/flutter/lib/src/widgets/icon_data.dart" ]; then
            sed -i 's/final class IconData/class IconData/g' "$FLUTTER_ROOT/packages/flutter/lib/src/widgets/icon_data.dart" || true
            sed -i 's/base class IconData/class IconData/g' "$FLUTTER_ROOT/packages/flutter/lib/src/widgets/icon_data.dart" || true
          fi
          find /home/runner/.pub-cache -name "icon_data.dart" 2>/dev/null | while read -r f; do
            sed -i 's/final class IconData/class IconData/g' "$f" 2>/dev/null || true
            sed -i 's/base class IconData/class IconData/g' "$f" 2>/dev/null || true
          done

          echo "Running flutter analyze suggestions..."
          flutter analyze --suggestions || true

          echo "Running flutter build apk..."
          BUILD_FLAGS="--no-tree-shake-icons --android-skip-build-dependency-validation -v"
          mkdir -p "$GITHUB_WORKSPACE/dist-logs"

          # Determine entrypoint if lib/main.dart does not exist directly
          ENTRY_ARG=""
          if [ ! -f "lib/main.dart" ]; then
            DART_FILE=$(find . -maxdepth 4 -name "main.dart" -not -path "*/.dart_tool/*" | head -n 1)
            if [ -z "$DART_FILE" ]; then
              DART_FILE=$(find . -maxdepth 4 -name "*.dart" -not -path "*/.dart_tool/*" | head -n 1)
            fi
            if [ -n "$DART_FILE" ]; then
              echo "Custom Dart Entrypoint: $DART_FILE"
              ENTRY_ARG="-t $DART_FILE"
            fi
          fi

          set -o pipefail
          if [ "${{ inputs.variant }}" = "release" ]; then
            echo "Building Release APK with Flutter..."
            if ! flutter build apk --release $BUILD_FLAGS $ENTRY_ARG 2>&1 | tee "$GITHUB_WORKSPACE/dist-logs/build_flutter.log"; then
              echo "⚠️ flutter build apk --release encountered issue. Trying fallback release via android/gradlew..."
              if [ -d "android" ]; then
                cd android
                chmod +x gradlew || true
                ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon
                cd ..
              fi
            fi
          else
            echo "Building Debug APK with Flutter..."
            flutter build apk --debug $BUILD_FLAGS $ENTRY_ARG 2>&1 | tee "$GITHUB_WORKSPACE/dist-logs/build_flutter.log"
          fi

      - name: 🔨 Build Android Gradle APK
        if: steps.detect.outputs.type == 'android'
        working-directory: ${{ steps.detect.outputs.proj_dir }}
        run: |
          echo "=== Building Android Gradle APK ==="
          mkdir -p ~/.gradle
          touch ~/.gradle/gradle.properties
          grep -q "android.newDsl" ~/.gradle/gradle.properties && sed -i 's/android.newDsl=true/android.newDsl=false/g' ~/.gradle/gradle.properties || echo "android.newDsl=false" >> ~/.gradle/gradle.properties
          grep -q "android.builtInKotlin" ~/.gradle/gradle.properties && sed -i 's/android.builtInKotlin=true/android.builtInKotlin=false/g' ~/.gradle/gradle.properties || echo "android.builtInKotlin=false" >> ~/.gradle/gradle.properties

          find . -name "gradle.properties" | while read -r pFile; do
            grep -q "android.newDsl" "$pFile" && sed -i 's/android.newDsl=true/android.newDsl=false/g' "$pFile" || echo "android.newDsl=false" >> "$pFile"
            grep -q "android.builtInKotlin" "$pFile" && sed -i 's/android.builtInKotlin=true/android.builtInKotlin=false/g' "$pFile" || echo "android.builtInKotlin=false" >> "$pFile"
          done

          if [ -f "./gradlew" ]; then
            sed -i "s/\r$//" ./gradlew
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            echo "Using system gradle"
            GRADLE_CMD="gradle"
          fi
          TASK="assembleDebug"
          if [ "${{ inputs.variant }}" = "release" ]; then
            TASK="assembleRelease"
          fi
          EXTRA_GRADLE_FLAGS=""
          if [ "${{ inputs.enable_profile }}" = "true" ]; then
            echo "Enabling Gradle --profile..."
            EXTRA_GRADLE_FLAGS="$EXTRA_GRADLE_FLAGS --profile"
          fi
          if [ "${{ inputs.enable_scan }}" = "true" ]; then
            echo "Enabling Gradle --scan..."
            EXTRA_GRADLE_FLAGS="$EXTRA_GRADLE_FLAGS --scan"
          fi
          $GRADLE_CMD $TASK --stacktrace --no-daemon $EXTRA_GRADLE_FLAGS

      - name: 📦 Process & Sign Base APK
        if: steps.detect.outputs.type == 'apk_base'
        working-directory: ${{ steps.detect.outputs.proj_dir }}
        run: |
          echo "=== Processing Base APK ==="
          APK_IN=$(find . -maxdepth 3 -name "*.apk" -not -path "*/dist-apk/*" | head -n 1)
          if [ -z "$APK_IN" ]; then
            APK_IN=$(find "$GITHUB_WORKSPACE" -name "*.apk" -not -path "*/dist-apk/*" | head -n 1)
          fi
          echo "Found Base APK: $APK_IN"

          BUILD_TOOLS_DIR=$(find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist-apk"
          OUT_APK="$GITHUB_WORKSPACE/dist-apk/app-${{ inputs.variant }}-${{ inputs.job_id }}.apk"

          if [ -x "$BUILD_TOOLS_DIR/zipalign" ]; then
            echo "Applying zipalign..."
            "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$APK_IN" "$OUT_APK"
          else
            cp "$APK_IN" "$OUT_APK"
          fi

          if [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "Signing with apksigner (v1, v2, v3)..."
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              "$OUT_APK"
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$OUT_APK" || true
          else
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass android -keypass android "$OUT_APK" androiddebugkey || true
          fi

      - name: 📦 Locate, Align & Sign Output APK
        id: collect
        run: |
          mkdir -p dist-apk
          DEST_NAME="app-${{ inputs.variant }}-${{ inputs.job_id }}.apk"
          TARGET_APK="dist-apk/$DEST_NAME"

          # Requirement #10: Search for output APKs in Flutter, Gradle, and dist locations
          PRIMARY_APK=""
          if [ "${{ inputs.variant }}" = "release" ]; then
            PRIMARY_APK=$(find . -name "*release*.apk" -not -path "*/dist-apk/*" -not -path "*/.gradle/*" -not -name "*unaligned*" 2>/dev/null | head -n 1)
          fi
          if [ -z "$PRIMARY_APK" ]; then
            PRIMARY_APK=$(find "${{ steps.detect.outputs.proj_dir }}/build/app/outputs/flutter-apk" build/app/outputs/flutter-apk "${{ steps.detect.outputs.proj_dir }}/build/app/outputs/apk" build/app/outputs/apk app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$PRIMARY_APK" ]; then
            APK_FILES=$(find . -name "*.apk" -not -path "*/dist-apk/*" -not -path "*/.gradle/*" -not -path "*/builds/*input*" 2>/dev/null | sort -n)
            PRIMARY_APK=$(echo "$APK_FILES" | head -n 1)
          fi

          if [ -n "$PRIMARY_APK" ] && [ -f "$PRIMARY_APK" ]; then
            echo "✅ APK FOUND: $PRIMARY_APK"
            cp "$PRIMARY_APK" "$TARGET_APK"
          else
            echo "❌ BUILD FAILED: APK tidak ditemukan"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "Verifying / Signing Final APK with Android Build Tools: $BUILD_TOOLS_DIR"

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

          # Always ensure 4-byte zipalign
          if [ -x "$BUILD_TOOLS_DIR/zipalign" ]; then
            echo "Running zipalign verification & alignment..."
            "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$TARGET_APK" "dist-apk/aligned_$DEST_NAME" && mv "dist-apk/aligned_$DEST_NAME" "$TARGET_APK" || true
          fi

          # Always ensure apksigner v1, v2, v3
          if [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "Running apksigner sign (v1, v2, v3)..."
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              "$TARGET_APK" || true
            echo "Final APK Signature Verification:"
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$TARGET_APK" || true
          fi

          APK_SIZE=$(stat -c%s "$TARGET_APK" 2>/dev/null || stat -f%z "$TARGET_APK" 2>/dev/null || echo 0)
          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: Generated APK is empty (0 bytes)."
            exit 1
          fi
          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "apk_name=$DEST_NAME" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-output-${{ inputs.job_id }}
          path: dist-apk/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: 📄 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.job_id }}
          path: |
            dist-logs/*.log
            **/build_flutter.log
            **/pub_diag.log
          retention-days: 7
          if-no-files-found: ignore
