name: Fast APK Builder CI

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Build Job ID"
        required: true
        type: string
      user_id:
        description: "Telegram User ID"
        required: true
        type: string
      branch_name:
        description: "Target Job Branch"
        required: false
        type: string
        default: "main"
      project_path:
        description: "Path to Project Root directory"
        required: false
        type: string
        default: "."
      project_type:
        description: "Project type (android | flutter | apk_base | auto)"
        required: false
        type: string
        default: "auto"
      variant:
        description: "Build Variant (debug | release)"
        required: false
        type: string
        default: "debug"

jobs:
  build:
    name: Build APK (${{ inputs.job_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_name != "" && inputs.branch_name || github.ref }}
          fetch-depth: 1

      - name: 🔍 Detect Project Structure
        id: detect
        run: |
          PROJ_DIR="${{ inputs.project_path }}"
          if [ ! -d "$PROJ_DIR" ] || [ "$PROJ_DIR" = "." ]; then
            if [ -d "builds/${{ inputs.user_id }}/${{ inputs.job_id }}" ]; then
              PROJ_DIR="builds/${{ inputs.user_id }}/${{ inputs.job_id }}"
            fi
          fi

          if [ -f "$PROJ_DIR/project.zip" ]; then
            echo "Extracting $PROJ_DIR/project.zip..."
            unzip -o -q "$PROJ_DIR/project.zip" -d "$PROJ_DIR"
          elif [ -f "project.zip" ]; then
            echo "Extracting root project.zip..."
            unzip -o -q "project.zip" -d "$PROJ_DIR"
          fi

          find "$PROJ_DIR" -maxdepth 2 -name "*.zip" -not -name "project.zip" -exec unzip -o -q {} -d "$PROJ_DIR" \; 2>/dev/null || true

          PUBSPEC_FOUND=$(find "$PROJ_DIR" -maxdepth 5 -name "pubspec.yaml" -not -path "*/.gradle/*" | head -n 1)
          GRADLE_FOUND=$(find "$PROJ_DIR" -maxdepth 5 \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" \) -not -path "*/.gradle/*" | head -n 1)
          APK_FOUND=$(find "$PROJ_DIR" -maxdepth 5 -name "*.apk" -not -path "*/dist-apk/*" -not -path "*/build/*" | head -n 1)

          if [ -n "$PUBSPEC_FOUND" ]; then
            echo "type=flutter" >> $GITHUB_OUTPUT
            PROJ_DIR=$(dirname "$PUBSPEC_FOUND")
            echo "Framework: Flutter Project at $PROJ_DIR"
          elif [ -n "$GRADLE_FOUND" ]; then
            echo "type=android" >> $GITHUB_OUTPUT
            PROJ_DIR=$(dirname "$GRADLE_FOUND")
            echo "Framework: Android Gradle Project at $PROJ_DIR"
          elif [ -n "$APK_FOUND" ]; then
            echo "type=apk_base" >> $GITHUB_OUTPUT
            PROJ_DIR=$(dirname "$APK_FOUND")
            echo "Framework: Base APK at $PROJ_DIR"
          else
            echo "type=android" >> $GITHUB_OUTPUT
            echo "Framework: Default Android Gradle at $PROJ_DIR"
          fi
          echo "proj_dir=$PROJ_DIR" >> $GITHUB_OUTPUT

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        if: steps.detect.outputs.type == "android"

      - name: 📱 Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 🐦 Setup Flutter SDK (Latest Stable)
        if: steps.detect.outputs.type == "flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 🔨 Build Flutter APK
        if: steps.detect.outputs.type == "flutter"
        working-directory: ${{ steps.detect.outputs.proj_dir }}
        run: |
          echo "=== Building Flutter APK ==="
          # Auto-adapt SDK version in pubspec.yaml if solver fails
          flutter pub get || (
            echo "Adjusting SDK constraints in pubspec.yaml for compatibility..."
            sed -i "s/sdk: .*/sdk: \">=3.0.0 <4.0.0\"/" pubspec.yaml 2>/dev/null || true
            flutter pub upgrade || flutter pub get
          )
          if [ "${{ inputs.variant }}" = "release" ]; then
            flutter build apk --release --no-tree-shake-icons || flutter build apk --release
          else
            flutter build apk --debug --no-tree-shake-icons || flutter build apk --debug
          fi

      - name: 🔨 Build Android Gradle APK
        if: steps.detect.outputs.type == "android"
        working-directory: ${{ steps.detect.outputs.proj_dir }}
        run: |
          echo "=== Building Android Gradle APK ==="
          if [ -f "./gradlew" ]; then
            sed -i "s/\r$//" ./gradlew
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            echo "Using system gradle"
            GRADLE_CMD="gradle"
          fi
          TASK="assembleDebug"
          if [ "${{ inputs.variant }}" = "release" ]; then
            TASK="assembleRelease"
          fi
          $GRADLE_CMD $TASK --stacktrace --no-daemon

      - name: 📦 Process & Sign Base APK
        if: steps.detect.outputs.type == "apk_base"
        working-directory: ${{ steps.detect.outputs.proj_dir }}
        run: |
          echo "=== Processing Base APK ==="
          APK_IN=$(find . -maxdepth 3 -name "*.apk" -not -path "*/dist-apk/*" | head -n 1)
          if [ -z "$APK_IN" ]; then
            APK_IN=$(find "$GITHUB_WORKSPACE" -name "*.apk" -not -path "*/dist-apk/*" | head -n 1)
          fi
          echo "Found Base APK: $APK_IN"
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass android -keypass android "$APK_IN" androiddebugkey || true
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"
          cp "$APK_IN" "$GITHUB_WORKSPACE/dist-apk/app-${{ inputs.variant }}-${{ inputs.job_id }}.apk"

      - name: 📦 Locate Output APK
        id: collect
        run: |
          mkdir -p dist-apk
          DEST_NAME="app-${{ inputs.variant }}-${{ inputs.job_id }}.apk"
          if [ ! -f "dist-apk/$DEST_NAME" ]; then
            APK_FILES=$(find . -name "*.apk" -not -path "*/dist-apk/*" -not -path "*/.gradle/*" -not -path "*/builds/*input*" | sort -n)
            PRIMARY_APK=$(echo "$APK_FILES" | head -n 1)
            if [ -n "$PRIMARY_APK" ] && [ -f "$PRIMARY_APK" ]; then
              cp "$PRIMARY_APK" "dist-apk/$DEST_NAME"
            fi
          fi
          if [ ! -f "dist-apk/$DEST_NAME" ]; then
            echo "ERROR: No APK file was generated."
            exit 1
          fi
          APK_SIZE=$(stat -c%s "dist-apk/$DEST_NAME" 2>/dev/null || stat -f%z "dist-apk/$DEST_NAME" 2>/dev/null || echo 0)
          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: Generated APK is empty (0 bytes)."
            exit 1
          fi
          echo "apk_path=dist-apk/$DEST_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$DEST_NAME" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-output-${{ inputs.job_id }}
          path: dist-apk/*.apk
          retention-days: 7
          if-no-files-found: error
